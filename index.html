<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auf Wiedersehen Frau Uggowitzer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      color: #fff;
    }
    .container {
      text-align: center;
      position: relative;
      z-index: 2;
    }
    h1 {
      font-size: clamp(2rem, 8vw, 4.5rem);
      font-weight: 700;
      letter-spacing: 0.05em;
      background: linear-gradient(90deg, #e94560, #ff6b6b, #feca57, #48dbfb, #ff9ff3, #e94560);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: gradientShift 4s ease infinite, fadeInUp 1.5s ease-out;
      text-shadow: 0 0 40px rgba(233, 69, 96, 0.3);
    }
    .subtitle {
      margin-top: 1.5rem;
      font-size: clamp(1rem, 3vw, 1.4rem);
      opacity: 0;
      animation: fadeIn 2s ease-out 1s forwards;
      color: #a0aec0;
    }
    .hearts {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .heart {
      position: absolute;
      font-size: 1.5rem;
      opacity: 0;
      animation: floatHeart 6s ease-in infinite;
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes floatHeart {
      0% { opacity: 0; transform: translateY(100vh) scale(0.5); }
      20% { opacity: 0.8; }
      80% { opacity: 0.6; }
      100% { opacity: 0; transform: translateY(-20vh) scale(1.2); }
    }
    .wave {
      display: inline-block;
      animation: wave 2s ease-in-out infinite;
    }
    @keyframes wave {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(20deg); }
      75% { transform: rotate(-15deg); }
    }
  </style>
</head>
<body>
  <div class="hearts" id="hearts"></div>
  <div class="container">
    <h1>Auf Wiedersehen<br>Frau Uggowitzer <span class="wave">👋</span></h1>
    <p class="subtitle">Mit besten Wünschen und einem Lächeln</p>
  </div>
  <script>
    const heartsContainer = document.getElementById('hearts');
    const emojis = ['💖', '✨', '🌟', '💫', '❤️', '🌸', '🦋'];
    function createHeart() {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (4 + Math.random() * 4) + 's';
      heart.style.animationDelay = Math.random() * 2 + 's';
      heart.style.fontSize = (1 + Math.random() * 1.5) + 'rem';
      heartsContainer.appendChild(heart);
      setTimeout(() => heart.remove(), 8000);
    }
    setInterval(createHeart, 400);
    for (let i = 0; i < 8; i++) setTimeout(createHeart, i * 300);
  </script>
</body>
</html>
