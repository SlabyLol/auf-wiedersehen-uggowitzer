<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auf Wiedersehen Frau Uggowitzer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: #030308;
      font-family: 'Outfit', system-ui, sans-serif;
    }

    canvas { position: fixed; inset: 0; z-index: 1; }

    .vignette {
      position: fixed; inset: 0; z-index: 3;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 45%, transparent 25%, rgba(0,0,0,0.75) 100%);
    }

    .ambient {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 80% 50% at 20% 20%, rgba(180, 80, 220, 0.12), transparent),
        radial-gradient(ellipse 70% 60% at 80% 70%, rgba(255, 90, 140, 0.1), transparent),
        radial-gradient(ellipse 60% 40% at 50% 90%, rgba(80, 140, 255, 0.08), transparent);
    }

    .scene {
      position: relative;
      z-index: 10;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
      perspective: 1400px;
    }

    .text-block {
      transform-style: preserve-3d;
      transition: transform 0.12s ease-out;
      position: relative;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.6rem, 10vw, 6.2rem);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: 0.01em;
    }

    h1 .char {
      display: inline-block;
      opacity: 0;
      transform: translateY(90px) scale(0.35) rotateX(55deg);
      filter: blur(14px);
      background: linear-gradient(125deg, #ff9ec4 0%, #e0b0ff 20%, #a8c8ff 45%, #8ef0d8 70%, #ffe0a0 100%);
      background-size: 250% 250%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: reveal 1.15s cubic-bezier(0.14, 1.1, 0.3, 1) forwards, glowShift 7s ease infinite;
    }

    @keyframes reveal {
      0% { opacity: 0; transform: translateY(90px) scale(0.35) rotateX(55deg); filter: blur(14px); }
      70% { filter: blur(0); }
      100% { opacity: 1; transform: translateY(0) scale(1) rotateX(0); filter: blur(0); }
    }

    @keyframes glowShift {
      0%, 100% { background-position: 0% 40%; filter: drop-shadow(0 0 20px rgba(224,176,255,0.25)); }
      50% { background-position: 100% 60%; filter: drop-shadow(0 0 35px rgba(255,158,196,0.4)); }
    }

    .line { display: block; }

    .wave {
      display: inline-block;
      font-size: 0.9em;
      transform-origin: 70% 80%;
      animation: wave 2s ease-in-out infinite;
      filter: drop-shadow(0 0 16px rgba(255,190,130,0.7));
    }
    @keyframes wave {
      0%, 100% { transform: rotate(0); }
      10% { transform: rotate(24deg); }
      20% { transform: rotate(-16deg); }
      30% { transform: rotate(20deg); }
      40% { transform: rotate(-12deg); }
      50% { transform: rotate(14deg); }
      60% { transform: rotate(-8deg); }
    }

    .divider {
      width: 0;
      height: 1px;
      margin: 1.8rem auto 0;
      background: linear-gradient(90deg, transparent, rgba(255,200,230,0.5), transparent);
      opacity: 0;
      animation: expandLine 1.4s ease 2.7s forwards;
    }
    @keyframes expandLine {
      to { width: min(280px, 50vw); opacity: 1; }
    }

    .subtitle {
      margin-top: 1.5rem;
      font-size: clamp(0.9rem, 2.6vw, 1.15rem);
      font-weight: 300;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      opacity: 0;
      animation: fadeUp 1.5s ease 3s forwards;
    }

    .from {
      margin-top: 1.1rem;
      font-size: clamp(1rem, 2.8vw, 1.25rem);
      font-weight: 400;
      letter-spacing: 0.1em;
      color: rgba(255, 210, 230, 0.75);
      opacity: 0;
      animation: fadeUp 1.5s ease 3.5s forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hearts-layer {
      position: fixed; inset: 0; z-index: 6;
      pointer-events: none; overflow: hidden;
    }
    .floating {
      position: absolute;
      opacity: 0;
      animation: rise 8s ease-in forwards;
      filter: drop-shadow(0 0 10px rgba(255,140,180,0.45));
    }
    @keyframes rise {
      0% { opacity: 0; transform: translateY(0) scale(0.3) rotate(0); }
      12% { opacity: 0.9; }
      100% { opacity: 0; transform: translateY(-115vh) scale(1.4) rotate(30deg); }
    }
  </style>
</head>
<body>
  <div class="ambient"></div>
  <canvas id="c"></canvas>
  <div class="vignette"></div>
  <div class="hearts-layer" id="hearts"></div>

  <div class="scene">
    <div class="text-block" id="textBlock">
      <h1 id="title"></h1>
      <div class="divider"></div>
      <p class="subtitle">Mit besten Wünschen und einem Lächeln</p>
      <p class="from">Von Tobias Musch</p>
    </div>
  </div>

  <script>
    const lines = ["Auf Wiedersehen", "Frau Uggowitzer "];
    const title = document.getElementById("title");
    let delay = 0.2;
    let html = "";

    lines.forEach((line, li) => {
      html += `<span class="line">`;
      [...line].forEach(ch => {
        html += `<span class="char" style="animation-delay:${delay}s">${ch === " " ? "&nbsp;" : ch}</span>`;
        delay += 0.05;
      });
      html += `</span>`;
      if (li === 0) delay += 0.3;
    });
    html += `<span class="char wave" style="animation-delay:${delay + 0.2}s">👋</span>`;
    title.innerHTML = html;

    // Hearts & petals
    const layer = document.getElementById("hearts");
    const icons = ["💖", "✨", "🌸", "💫", "🦋", "🌟", "💕", "❀"];
    function spawn() {
      const el = document.createElement("div");
      el.className = "floating";
      el.textContent = icons[Math.floor(Math.random() * icons.length)];
      el.style.left = 4 + Math.random() * 92 + "%";
      el.style.bottom = "-50px";
      el.style.fontSize = (1.1 + Math.random() * 1.7) + "rem";
      el.style.animationDuration = (6 + Math.random() * 5) + "s";
      layer.appendChild(el);
      setTimeout(() => el.remove(), 12000);
    }
    setInterval(spawn, 480);
    for (let i = 0; i < 8; i++) setTimeout(spawn, i * 350);

    // 3D tilt
    const block = document.getElementById("textBlock");
    document.addEventListener("mousemove", e => {
      const x = (e.clientX / innerWidth - 0.5) * 16;
      const y = (e.clientY / innerHeight - 0.5) * -11;
      block.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
    });

    // Advanced particles
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    let w, h, mx = 0.5, my = 0.5;

    function resize() {
      w = canvas.width = innerWidth;
      h = canvas.height = innerHeight;
    }
    addEventListener("resize", resize);
    resize();
    addEventListener("mousemove", e => { mx = e.clientX / w; my = e.clientY / h; });

    const palette = ["#ff9ec4", "#e0b0ff", "#a8c8ff", "#8ef0d8", "#ffe0a0", "#ffb08a"];

    class Particle {
      constructor(burst = false) {
        this.burst = burst;
        this.reset(true);
      }
      reset(init) {
        if (this.burst) {
          this.x = w * 0.5 + (Math.random() - 0.5) * 80;
          this.y = h * 0.42 + (Math.random() - 0.5) * 40;
          const angle = Math.random() * Math.PI * 2;
          const speed = 2 + Math.random() * 6;
          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed - 1;
          this.life = 0;
          this.max = 50 + Math.random() * 40;
          this.size = 1.5 + Math.random() * 3;
        } else {
          this.x = Math.random() * w;
          this.y = init ? Math.random() * h : h + 20;
          this.vx = (Math.random() - 0.5) * 0.4;
          this.vy = -(0.2 + Math.random() * 0.9);
          this.life = 0;
          this.max = 250 + Math.random() * 200;
          this.size = 0.8 + Math.random() * 2.4;
        }
        this.color = palette[Math.floor(Math.random() * palette.length)];
        this.alpha = 0.35 + Math.random() * 0.5;
        this.tw = Math.random() * 10;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.burst) {
          this.vy += 0.06;
          this.vx *= 0.98;
        } else {
          this.x += Math.sin(this.tw) * 0.2;
          this.tw += 0.025;
          // subtle mouse influence
          this.x += (mx - 0.5) * 0.15;
        }
        this.life++;
        if (this.life > this.max || this.y < -30 || this.y > h + 40) {
          if (this.burst) this.dead = true;
          else this.reset(false);
        }
      }
      draw() {
        const fade = this.life < 25 ? this.life / 25 : this.life > this.max - 30 ? (this.max - this.life) / 30 : 1;
        ctx.globalAlpha = this.alpha * fade;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 12;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
      }
    }

    class Spark {
      constructor() {
        this.points = [];
        this.reset();
      }
      reset() {
        this.x = Math.random() * w;
        this.y = h + 10;
        this.vx = (Math.random() - 0.5) * 2.2;
        this.vy = -(2 + Math.random() * 3.5);
        this.life = 0;
        this.max = 35 + Math.random() * 35;
        this.color = palette[Math.floor(Math.random() * palette.length)];
        this.points = [];
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.035;
        this.points.push({ x: this.x, y: this.y });
        if (this.points.length > 14) this.points.shift();
        this.life++;
        if (this.life > this.max || this.y < -40) this.reset();
      }
      draw() {
        if (this.points.length < 2) return;
        ctx.beginPath();
        ctx.moveTo(this.points[0].x, this.points[0].y);
        for (let i = 1; i < this.points.length; i++) ctx.lineTo(this.points[i].x, this.points[i].y);
        const g = ctx.createLinearGradient(this.points[0].x, this.points[0].y, this.points.at(-1).x, this.points.at(-1).y);
        g.addColorStop(0, "transparent");
        g.addColorStop(1, this.color);
        ctx.strokeStyle = g;
        ctx.lineWidth = 1.8;
        ctx.lineCap = "round";
        ctx.globalAlpha = 0.55;
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }

    const particles = Array.from({ length: 95 }, () => new Particle());
    const sparks = Array.from({ length: 12 }, () => new Spark());
    let bursts = [];

    // Burst after text finishes appearing
    setTimeout(() => {
      for (let i = 0; i < 55; i++) bursts.push(new Particle(true));
    }, 3100);

    function loop() {
      ctx.fillStyle = "rgba(3, 3, 8, 0.2)";
      ctx.fillRect(0, 0, w, h);

      particles.forEach(p => { p.update(); p.draw(); });
      sparks.forEach(s => { s.update(); s.draw(); });

      bursts = bursts.filter(b => !b.dead);
      bursts.forEach(b => { b.update(); b.draw(); });

      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
