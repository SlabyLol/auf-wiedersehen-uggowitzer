<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auf Wiedersehen Frau Uggowitzer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: #0a0a12;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
    }
    .scene {
      position: relative;
      z-index: 2;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .glow-ring {
      position: absolute;
      width: min(90vw, 520px);
      height: min(90vw, 520px);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(233,69,96,0.15) 0%, transparent 70%);
      filter: blur(40px);
      animation: pulseRing 4s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes pulseRing {
      0%, 100% { transform: scale(0.9); opacity: 0.6; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    .text-wrap {
      position: relative;
    }
    h1 {
      font-size: clamp(2.2rem, 9vw, 5.2rem);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-bottom: 0.3em;
    }
    h1 span {
      display: inline-block;
      background: linear-gradient(120deg, #ff6b9d, #c44dff, #6b8cff, #4dffc4, #ffd56b, #ff6b9d);
      background-size: 400% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: gradientFlow 6s linear infinite, letterPop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      text-shadow: 0 0 60px rgba(196, 77, 255, 0.35);
    }
    h1 span:nth-child(1) { animation-delay: 0.05s, 0.1s; }
    h1 span:nth-child(2) { animation-delay: 0.05s, 0.2s; }
    h1 span:nth-child(3) { animation-delay: 0.05s, 0.3s; }
    h1 span:nth-child(4) { animation-delay: 0.05s, 0.4s; }
    h1 span:nth-child(5) { animation-delay: 0.05s, 0.5s; }
    h1 span:nth-child(6) { animation-delay: 0.05s, 0.6s; }
    h1 span:nth-child(7) { animation-delay: 0.05s, 0.7s; }
    h1 span:nth-child(8) { animation-delay: 0.05s, 0.8s; }
    h1 span:nth-child(9) { animation-delay: 0.05s, 0.9s; }
    h1 span:nth-child(10) { animation-delay: 0.05s, 1.0s; }
    h1 span:nth-child(11) { animation-delay: 0.05s, 1.1s; }
    h1 span:nth-child(12) { animation-delay: 0.05s, 1.2s; }
    h1 span:nth-child(13) { animation-delay: 0.05s, 1.3s; }
    h1 span:nth-child(14) { animation-delay: 0.05s, 1.4s; }
    h1 span:nth-child(15) { animation-delay: 0.05s, 1.5s; }
    h1 span:nth-child(16) { animation-delay: 0.05s, 1.6s; }
    h1 span:nth-child(17) { animation-delay: 0.05s, 1.7s; }
    h1 span:nth-child(18) { animation-delay: 0.05s, 1.8s; }
    h1 span:nth-child(19) { animation-delay: 0.05s, 1.9s; }
    h1 span:nth-child(20) { animation-delay: 0.05s, 2.0s; }
    h1 span:nth-child(21) { animation-delay: 0.05s, 2.1s; }
    h1 span:nth-child(22) { animation-delay: 0.05s, 2.2s; }
    h1 span:nth-child(23) { animation-delay: 0.05s, 2.3s; }
    h1 span:nth-child(24) { animation-delay: 0.05s, 2.4s; }
    h1 span:nth-child(25) { animation-delay: 0.05s, 2.5s; }
    h1 span:nth-child(26) { animation-delay: 0.05s, 2.6s; }
    h1 span:nth-child(27) { animation-delay: 0.05s, 2.7s; }
    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      100% { background-position: 400% 50%; }
    }
    @keyframes letterPop {
      0% { opacity: 0; transform: translateY(60px) scale(0.4) rotateX(40deg); filter: blur(8px); }
      100% { opacity: 1; transform: translateY(0) scale(1) rotateX(0); filter: blur(0); }
    }
    .line2 {
      display: block;
      margin-top: 0.15em;
    }
    .wave {
      display: inline-block;
      font-size: 1.1em;
      animation: waveHand 1.8s ease-in-out infinite;
      transform-origin: 70% 70%;
    }
    @keyframes waveHand {
      0%, 100% { transform: rotate(0deg); }
      15% { transform: rotate(18deg); }
      30% { transform: rotate(-12deg); }
      45% { transform: rotate(16deg); }
      60% { transform: rotate(-8deg); }
      75% { transform: rotate(10deg); }
    }
    .subtitle {
      margin-top: 1.8rem;
      font-size: clamp(1rem, 3.2vw, 1.45rem);
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeUp 1.2s ease 2.8s forwards;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .sparkles {
      position: absolute;
      inset: -40px;
      pointer-events: none;
    }
    .sparkle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 0 10px 2px rgba(255,255,255,0.8);
      animation: sparkle 2.5s ease-in-out infinite;
    }
    @keyframes sparkle {
      0%, 100% { opacity: 0; transform: scale(0); }
      50% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="scene">
    <div class="glow-ring"></div>
    <div class="text-wrap">
      <div class="sparkles" id="sparkles"></div>
      <h1 id="title"></h1>
      <p class="subtitle">Mit besten Wünschen und einem Lächeln</p>
    </div>
  </div>
  <script>
    // Letter-by-letter title
    const text1 = "Auf Wiedersehen";
    const text2 = "Frau Uggowitzer ";
    const title = document.getElementById("title");
    let html = "";
    [...text1].forEach((ch, i) => {
      html += `<span style="animation-delay: 0.05s, ${0.08 + i * 0.07}s">${ch === " " ? "&nbsp;" : ch}</span>`;
    });
    html += `<span class="line2"></span>`;
    [...text2].forEach((ch, i) => {
      html += `<span style="animation-delay: 0.05s, ${1.3 + i * 0.07}s">${ch === " " ? "&nbsp;" : ch}</span>`;
    });
    html += `<span class="wave" style="animation-delay: 0.05s, 2.6s">👋</span>`;
    title.innerHTML = html;

    // Sparkles around text
    const sparkles = document.getElementById("sparkles");
    for (let i = 0; i < 18; i++) {
      const s = document.createElement("div");
      s.className = "sparkle";
      s.style.left = Math.random() * 100 + "%";
      s.style.top = Math.random() * 100 + "%";
      s.style.animationDelay = Math.random() * 2.5 + "s";
      s.style.animationDuration = (1.5 + Math.random() * 2) + "s";
      sparkles.appendChild(s);
    }

    // Particle canvas
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    let w, h, particles = [];

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    const colors = ["#ff6b9d", "#c44dff", "#6b8cff", "#4dffc4", "#ffd56b", "#ff9f6b"];

    class Particle {
      constructor() { this.reset(true); }
      reset(init) {
        this.x = Math.random() * w;
        this.y = init ? Math.random() * h : h + 20;
        this.size = 1.5 + Math.random() * 3.5;
        this.speedY = 0.3 + Math.random() * 1.2;
        this.speedX = (Math.random() - 0.5) * 0.6;
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.alpha = 0.3 + Math.random() * 0.5;
        this.life = 0;
        this.maxLife = 200 + Math.random() * 300;
      }
      update() {
        this.y -= this.speedY;
        this.x += this.speedX + Math.sin(this.life * 0.02) * 0.4;
        this.life++;
        if (this.life > this.maxLife || this.y < -20) this.reset(false);
      }
      draw() {
        const fade = this.life < 40 ? this.life / 40 : this.life > this.maxLife - 40 ? (this.maxLife - this.life) / 40 : 1;
        ctx.globalAlpha = this.alpha * fade;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.shadowBlur = 12;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
      }
    }

    for (let i = 0; i < 90; i++) particles.push(new Particle());

    function animate() {
      ctx.fillStyle = "rgba(10, 10, 18, 0.25)";
      ctx.fillRect(0, 0, w, h);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
