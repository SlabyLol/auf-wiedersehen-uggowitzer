<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auf Wiedersehen Frau Uggowitzer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: #030308;
      font-family: 'Outfit', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    canvas { position: fixed; inset: 0; z-index: 1; }

    .vignette {
      position: fixed; inset: 0; z-index: 3;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 42%, transparent 20%, rgba(0,0,0,0.78) 100%);
    }

    .ambient {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 90% 55% at 15% 15%, rgba(170, 70, 210, 0.14), transparent),
        radial-gradient(ellipse 80% 55% at 85% 75%, rgba(255, 80, 130, 0.11), transparent),
        radial-gradient(ellipse 70% 45% at 50% 95%, rgba(70, 130, 255, 0.09), transparent);
    }

    .scene {
      position: relative;
      z-index: 10;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
      perspective: 1200px;
    }

    .text-block {
      transform-style: preserve-3d;
      transition: transform 0.12s ease-out;
      will-change: transform;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.5rem, 9.5vw, 5.8rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: 0.01em;
      color: #fff;
    }

    h1 .char {
      display: inline-block;
      opacity: 0;
      transform: translateY(70px) scale(0.5);
      color: #ffb8d4;
      text-shadow:
        0 0 20px rgba(255, 160, 200, 0.55),
        0 0 50px rgba(200, 140, 255, 0.3);
      animation: reveal 0.95s cubic-bezier(0.16, 1.15, 0.3, 1) forwards;
    }

    /* Soft rainbow tint via separate span layers if needed – keep solid for Safari */
    h1 .char.pink { color: #ff9ec8; text-shadow: 0 0 22px rgba(255, 150, 200, 0.6), 0 0 50px rgba(255, 120, 180, 0.25); }
    h1 .char.purple { color: #e0b8ff; text-shadow: 0 0 22px rgba(200, 150, 255, 0.55), 0 0 50px rgba(180, 120, 255, 0.25); }
    h1 .char.blue { color: #b0d0ff; text-shadow: 0 0 22px rgba(150, 190, 255, 0.5), 0 0 50px rgba(120, 160, 255, 0.2); }
    h1 .char.mint { color: #a0f0e0; text-shadow: 0 0 22px rgba(140, 240, 220, 0.5), 0 0 50px rgba(100, 220, 200, 0.2); }
    h1 .char.gold { color: #ffe0a8; text-shadow: 0 0 22px rgba(255, 210, 140, 0.55), 0 0 50px rgba(255, 190, 100, 0.2); }

    @keyframes reveal {
      0% {
        opacity: 0;
        transform: translateY(70px) scale(0.5);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .line { display: block; }

    .wave {
      display: inline-block;
      font-size: 0.9em;
      transform-origin: 70% 80%;
      animation: wave 2s ease-in-out infinite;
      filter: drop-shadow(0 0 14px rgba(255, 190, 130, 0.7));
    }
    @keyframes wave {
      0%, 100% { transform: rotate(0); }
      12% { transform: rotate(22deg); }
      24% { transform: rotate(-14deg); }
      36% { transform: rotate(18deg); }
      48% { transform: rotate(-10deg); }
      60% { transform: rotate(12deg); }
    }

    .divider {
      width: 0;
      height: 1px;
      margin: 1.6rem auto 0;
      background: linear-gradient(90deg, transparent, rgba(255, 200, 230, 0.55), transparent);
      opacity: 0;
      animation: expandLine 1.3s ease 2.5s forwards;
    }
    @keyframes expandLine {
      to { width: min(260px, 48vw); opacity: 1; }
    }

    .subtitle {
      margin-top: 1.4rem;
      font-size: clamp(0.85rem, 2.5vw, 1.1rem);
      font-weight: 300;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.42);
      opacity: 0;
      animation: fadeUp 1.4s ease 2.8s forwards;
    }

    .from {
      margin-top: 1rem;
      font-size: clamp(0.95rem, 2.6vw, 1.2rem);
      font-weight: 400;
      letter-spacing: 0.08em;
      color: rgba(255, 210, 230, 0.8);
      opacity: 0;
      animation: fadeUp 1.4s ease 3.3s forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hearts-layer {
      position: fixed; inset: 0; z-index: 6;
      pointer-events: none; overflow: hidden;
    }
    .floating {
      position: absolute;
      opacity: 0;
      animation: rise 7.5s ease-in forwards;
      filter: drop-shadow(0 0 8px rgba(255, 140, 180, 0.4));
    }
    @keyframes rise {
      0% { opacity: 0; transform: translateY(0) scale(0.35) rotate(0); }
      12% { opacity: 0.9; }
      100% { opacity: 0; transform: translateY(-115vh) scale(1.35) rotate(28deg); }
    }
  </style>
</head>
<body>
  <div class="ambient"></div>
  <canvas id="c"></canvas>
  <div class="vignette"></div>
  <div class="hearts-layer" id="hearts"></div>

  <div class="scene">
    <div class="text-block" id="textBlock">
      <h1 id="title"></h1>
      <div class="divider"></div>
      <p class="subtitle">Mit besten Wünschen und einem Lächeln</p>
      <p class="from">Von Tobias Musch</p>
    </div>
  </div>

  <script>
    const lines = ["Auf Wiedersehen", "Frau Uggowitzer "];
    const colors = ["pink", "purple", "blue", "mint", "gold"];
    const title = document.getElementById("title");
    let delay = 0.18;
    let html = "";
    let colorIdx = 0;

    lines.forEach((line, li) => {
      html += `<span class="line">`;
      [...line].forEach(ch => {
        const cls = colors[colorIdx % colors.length];
        colorIdx++;
        html += `<span class="char ${cls}" style="animation-delay:${delay}s">${ch === " " ? "&nbsp;" : ch}</span>`;
        delay += 0.048;
      });
      html += `</span>`;
      if (li === 0) delay += 0.28;
    });
    html += `<span class="char wave" style="animation-delay:${delay + 0.15}s">👋</span>`;
    title.innerHTML = html;

    // Floating icons
    const layer = document.getElementById("hearts");
    const icons = ["💖", "✨", "🌸", "💫", "🦋", "🌟", "💕"];
    function spawn() {
      const el = document.createElement("div");
      el.className = "floating";
      el.textContent = icons[Math.floor(Math.random() * icons.length)];
      el.style.left = 3 + Math.random() * 94 + "%";
      el.style.bottom = "-40px";
      el.style.fontSize = (1 + Math.random() * 1.5) + "rem";
      el.style.animationDuration = (5.5 + Math.random() * 4.5) + "s";
      layer.appendChild(el);
      setTimeout(() => el.remove(), 11000);
    }
    setInterval(spawn, 520);
    for (let i = 0; i < 7; i++) setTimeout(spawn, i * 320);

    // Gentle 3D tilt
    const block = document.getElementById("textBlock");
    document.addEventListener("mousemove", e => {
      const x = (e.clientX / innerWidth - 0.5) * 12;
      const y = (e.clientY / innerHeight - 0.5) * -8;
      block.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
    });

    // Particles
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    let w, h;

    function resize() {
      w = canvas.width = innerWidth;
      h = canvas.height = innerHeight;
    }
    addEventListener("resize", resize);
    resize();

    const palette = ["#ff9ec8", "#e0b8ff", "#b0d0ff", "#a0f0e0", "#ffe0a8", "#ffb08a"];

    class Particle {
      constructor(burst = false) {
        this.burst = burst;
        this.reset(true);
      }
      reset(init) {
        if (this.burst) {
          this.x = w * 0.5 + (Math.random() - 0.5) * 100;
          this.y = h * 0.4 + (Math.random() - 0.5) * 50;
          const a = Math.random() * Math.PI * 2;
          const s = 1.8 + Math.random() * 5.5;
          this.vx = Math.cos(a) * s;
          this.vy = Math.sin(a) * s - 1.2;
          this.life = 0;
          this.max = 45 + Math.random() * 35;
          this.size = 1.4 + Math.random() * 2.8;
        } else {
          this.x = Math.random() * w;
          this.y = init ? Math.random() * h : h + 15;
          this.vx = (Math.random() - 0.5) * 0.35;
          this.vy = -(0.18 + Math.random() * 0.75);
          this.life = 0;
          this.max = 220 + Math.random() * 180;
          this.size = 0.7 + Math.random() * 2.1;
        }
        this.color = palette[Math.floor(Math.random() * palette.length)];
        this.alpha = 0.3 + Math.random() * 0.45;
        this.tw = Math.random() * 8;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.burst) {
          this.vy += 0.055;
          this.vx *= 0.985;
        } else {
          this.x += Math.sin(this.tw) * 0.18;
          this.tw += 0.022;
        }
        this.life++;
        if (this.life > this.max || this.y < -25) {
          if (this.burst) this.dead = true;
          else this.reset(false);
        }
      }
      draw() {
        const fade = this.life < 20 ? this.life / 20 : this.life > this.max - 25 ? (this.max - this.life) / 25 : 1;
        ctx.globalAlpha = this.alpha * fade;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
      }
    }

    class Spark {
      constructor() { this.points = []; this.reset(); }
      reset() {
        this.x = Math.random() * w;
        this.y = h + 8;
        this.vx = (Math.random() - 0.5) * 1.8;
        this.vy = -(1.8 + Math.random() * 3);
        this.life = 0;
        this.max = 30 + Math.random() * 30;
        this.color = palette[Math.floor(Math.random() * palette.length)];
        this.points = [];
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.03;
        this.points.push({ x: this.x, y: this.y });
        if (this.points.length > 12) this.points.shift();
        this.life++;
        if (this.life > this.max || this.y < -30) this.reset();
      }
      draw() {
        if (this.points.length < 2) return;
        ctx.beginPath();
        ctx.moveTo(this.points[0].x, this.points[0].y);
        for (let i = 1; i < this.points.length; i++) ctx.lineTo(this.points[i].x, this.points[i].y);
        const g = ctx.createLinearGradient(this.points[0].x, this.points[0].y, this.points.at(-1).x, this.points.at(-1).y);
        g.addColorStop(0, "transparent");
        g.addColorStop(1, this.color);
        ctx.strokeStyle = g;
        ctx.lineWidth = 1.6;
        ctx.lineCap = "round";
        ctx.globalAlpha = 0.5;
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }

    const particles = Array.from({ length: 80 }, () => new Particle());
    const sparks = Array.from({ length: 10 }, () => new Spark());
    let bursts = [];

    setTimeout(() => {
      for (let i = 0; i < 48; i++) bursts.push(new Particle(true));
    }, 2800);

    function loop() {
      ctx.fillStyle = "rgba(3, 3, 8, 0.22)";
      ctx.fillRect(0, 0, w, h);
      particles.forEach(p => { p.update(); p.draw(); });
      sparks.forEach(s => { s.update(); s.draw(); });
      bursts = bursts.filter(b => !b.dead);
      bursts.forEach(b => { b.update(); b.draw(); });
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
