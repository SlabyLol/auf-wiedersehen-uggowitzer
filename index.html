<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auf Wiedersehen Frau Uggowitzer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: #05050a;
      font-family: 'Inter', system-ui, sans-serif;
      cursor: default;
    }

    canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 100%);
    }

    .light-rays {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        conic-gradient(from 0deg at 50% 50%,
          transparent 0deg,
          rgba(255, 120, 180, 0.03) 20deg,
          transparent 40deg,
          rgba(140, 100, 255, 0.04) 60deg,
          transparent 80deg,
          rgba(100, 200, 255, 0.03) 100deg,
          transparent 120deg,
          rgba(255, 200, 100, 0.03) 140deg,
          transparent 160deg);
      animation: rotateRays 40s linear infinite;
      opacity: 0.6;
    }
    @keyframes rotateRays {
      to { transform: rotate(360deg); }
    }

    .scene {
      position: relative;
      z-index: 10;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      perspective: 1200px;
    }

    .text-block {
      transform-style: preserve-3d;
      transition: transform 0.15s ease-out;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.4rem, 9.5vw, 5.8rem);
      font-weight: 700;
      line-height: 1.12;
      letter-spacing: -0.01em;
      margin-bottom: 0.15em;
    }

    h1 .char {
      display: inline-block;
      opacity: 0;
      transform: translateY(80px) scale(0.5) rotateX(50deg);
      filter: blur(12px);
      background: linear-gradient(135deg, #ff8ab5 0%, #d4a5ff 25%, #8bb8ff 50%, #7dffe0 75%, #ffd88a 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: revealChar 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards, shimmer 8s ease infinite;
      text-shadow: 0 0 80px rgba(212, 165, 255, 0.4);
    }

    @keyframes revealChar {
      to {
        opacity: 1;
        transform: translateY(0) scale(1) rotateX(0);
        filter: blur(0);
      }
    }

    @keyframes shimmer {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .line {
      display: block;
    }

    .wave {
      display: inline-block;
      font-size: 0.95em;
      transform-origin: 70% 80%;
      animation: wave 2.2s ease-in-out infinite;
      filter: drop-shadow(0 0 12px rgba(255, 180, 120, 0.6));
    }
    @keyframes wave {
      0%, 100% { transform: rotate(0deg); }
      12% { transform: rotate(22deg); }
      24% { transform: rotate(-14deg); }
      36% { transform: rotate(18deg); }
      48% { transform: rotate(-10deg); }
      60% { transform: rotate(12deg); }
      72% { transform: rotate(-6deg); }
    }

    .subtitle {
      margin-top: 2.2rem;
      font-size: clamp(0.95rem, 2.8vw, 1.25rem);
      font-weight: 300;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.45);
      opacity: 0;
      animation: fadeIn 1.6s ease 2.9s forwards;
    }

    .from {
      margin-top: 1.4rem;
      font-size: clamp(0.9rem, 2.4vw, 1.15rem);
      font-weight: 400;
      letter-spacing: 0.08em;
      color: rgba(255, 200, 220, 0.7);
      opacity: 0;
      animation: fadeIn 1.6s ease 3.4s forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .hearts-layer {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      overflow: hidden;
    }
    .floating-heart {
      position: absolute;
      font-size: 1.4rem;
      opacity: 0;
      animation: floatUp 7s ease-in forwards;
      filter: drop-shadow(0 0 8px rgba(255, 120, 160, 0.5));
    }
    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(0) scale(0.4) rotate(0deg); }
      15% { opacity: 0.85; }
      100% { opacity: 0; transform: translateY(-110vh) scale(1.3) rotate(25deg); }
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.25;
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body>
  <div class="orb" style="width:420px;height:420px;background:#c44dff;top:10%;left:5%;animation:drift1 18s ease-in-out infinite alternate;"></div>
  <div class="orb" style="width:350px;height:350px;background:#ff6b9d;bottom:15%;right:8%;animation:drift2 22s ease-in-out infinite alternate;"></div>
  <div class="orb" style="width:280px;height:280px;background:#6b8cff;top:40%;right:20%;animation:drift3 15s ease-in-out infinite alternate;"></div>

  <style>
    @keyframes drift1 { to { transform: translate(80px, 60px); } }
    @keyframes drift2 { to { transform: translate(-70px, -50px); } }
    @keyframes drift3 { to { transform: translate(40px, -80px); } }
  </style>

  <div class="light-rays"></div>
  <canvas id="c"></canvas>
  <div class="vignette"></div>
  <div class="hearts-layer" id="hearts"></div>

  <div class="scene">
    <div class="text-block" id="textBlock">
      <h1 id="title"></h1>
      <p class="subtitle">Mit besten Wünschen und einem Lächeln</p>
      <p class="from">Von Tobias Musch</p>
    </div>
  </div>

  <script>
    // Build title letter by letter
    const lines = ["Auf Wiedersehen", "Frau Uggowitzer "];
    const title = document.getElementById("title");
    let delay = 0.15;
    let html = "";

    lines.forEach((line, li) => {
      html += `<span class="line">`;
      [...line].forEach((ch) => {
        const content = ch === " " ? "&nbsp;" : ch;
        html += `<span class="char" style="animation-delay:${delay}s">${content}</span>`;
        delay += 0.055;
      });
      html += `</span>`;
      if (li === 0) delay += 0.25;
    });
    html += `<span class="char wave" style="animation-delay:${delay + 0.15}s">👋</span>`;
    title.innerHTML = html;

    // Floating hearts
    const hearts = document.getElementById("hearts");
    const emojis = ["💖", "✨", "🌸", "💫", "🦋", "🌟", "💕"];
    function spawnHeart() {
      const el = document.createElement("div");
      el.className = "floating-heart";
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left = 5 + Math.random() * 90 + "%";
      el.style.bottom = "-40px";
      el.style.fontSize = (1 + Math.random() * 1.6) + "rem";
      el.style.animationDuration = (5.5 + Math.random() * 4) + "s";
      hearts.appendChild(el);
      setTimeout(() => el.remove(), 10000);
    }
    setInterval(spawnHeart, 550);
    for (let i = 0; i < 6; i++) setTimeout(spawnHeart, i * 400);

    // 3D tilt on mouse
    const block = document.getElementById("textBlock");
    document.addEventListener("mousemove", (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 18;
      const y = (e.clientY / window.innerHeight - 0.5) * -12;
      block.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
    });

    // Particle system
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    let w, h;

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    const palette = ["#ff8ab5", "#d4a5ff", "#8bb8ff", "#7dffe0", "#ffd88a", "#ff9f7a"];

    class Star {
      constructor() { this.reset(true); }
      reset(init) {
        this.x = Math.random() * w;
        this.y = init ? Math.random() * h : h + 10;
        this.z = Math.random() * 0.8 + 0.2;
        this.size = (Math.random() * 2.2 + 0.6) * this.z;
        this.speed = (0.25 + Math.random() * 0.9) * this.z;
        this.vx = (Math.random() - 0.5) * 0.35;
        this.color = palette[Math.floor(Math.random() * palette.length)];
        this.alpha = 0.25 + Math.random() * 0.55;
        this.twinkle = Math.random() * Math.PI * 2;
      }
      update() {
        this.y -= this.speed;
        this.x += this.vx + Math.sin(this.twinkle) * 0.15;
        this.twinkle += 0.03;
        if (this.y < -20) this.reset(false);
      }
      draw() {
        const a = this.alpha * (0.6 + 0.4 * Math.sin(this.twinkle));
        ctx.globalAlpha = a;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.shadowBlur = 14 * this.z;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
      }
    }

    class Trail {
      constructor() {
        this.points = [];
        this.reset();
      }
      reset() {
        this.x = Math.random() * w;
        this.y = h + 20;
        this.vx = (Math.random() - 0.5) * 1.8;
        this.vy = -(1.5 + Math.random() * 2.5);
        this.life = 0;
        this.max = 40 + Math.random() * 40;
        this.color = palette[Math.floor(Math.random() * palette.length)];
        this.points = [];
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.02;
        this.points.push({ x: this.x, y: this.y });
        if (this.points.length > 12) this.points.shift();
        this.life++;
        if (this.life > this.max || this.y < -30) this.reset();
      }
      draw() {
        if (this.points.length < 2) return;
        ctx.beginPath();
        ctx.moveTo(this.points[0].x, this.points[0].y);
        for (let i = 1; i < this.points.length; i++) {
          ctx.lineTo(this.points[i].x, this.points[i].y);
        }
        const grad = ctx.createLinearGradient(
          this.points[0].x, this.points[0].y,
          this.points[this.points.length - 1].x, this.points[this.points.length - 1].y
        );
        grad.addColorStop(0, "transparent");
        grad.addColorStop(1, this.color);
        ctx.strokeStyle = grad;
        ctx.lineWidth = 2;
        ctx.lineCap = "round";
        ctx.globalAlpha = 0.5;
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }

    const stars = Array.from({ length: 110 }, () => new Star());
    const trails = Array.from({ length: 14 }, () => new Trail());

    function loop() {
      ctx.fillStyle = "rgba(5, 5, 10, 0.22)";
      ctx.fillRect(0, 0, w, h);
      stars.forEach(s => { s.update(); s.draw(); });
      trails.forEach(t => { t.update(); t.draw(); });
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
